<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | سير-تك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
    /* تثبيت الصفحة بالكامل وملء الشاشة */
    body.page {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    /* جعل الصورة الخلفية تغطي الشاشة بالكامل */
    .bg-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
    }
    /* طبقة تغشية شفافة فوق الصورة لبروز نموذج تسجيل الدخول */
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1;
    }
    /* رفع نموذج تسجيل الدخول فوق الخلفية والطبقة */
    main.page {
        position: relative;
        z-index: 2;
    }
</style>
</head>
<body class="page">

    <!-- صورة الخلفية المباشرة -->
    <img src="car.JPG" alt="Background" class="bg-img">
    
    <!-- طبقة التغشية -->
    <div class="overlay"></div>

    <!-- نموذج تسجيل الدخول -->
    <main class="page">
        <form class="card" id="loginForm" novalidate>
            <h1>تسجيل الدخول <span>|</span> سير-تك</h1>
            <label for="email">البريد الإلكتروني</label>
            <input id="email" type="email" required autocomplete="email">
            
            <label for="pass">كلمة المرور</label>
            <input id="pass" type="password" required autocomplete="current-password">
            
            <p class="msg" id="msg" role="alert"></p>
            
            <button class="btn" type="submit">دخول</button>
            
            <p class="foot"><a href="index.html">↻ العودة للرئيسية</a></p>
        </form>
    </main>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var em = email.value.trim(), pw = pass.value;
    if(!/^\S+@\S+\.\S+$/.test(em) || pw.length < 4) {
        msg.textContent = 'تحقق من البريد وكلمة المرور.';
        return;
    }
    sessionStorage.setItem('sirtech_user', em);
    location.href = 'dashboard.html';
});
</script>

</body>
</html>
